name: Flight Booking CICD

on:
  push:
    branches:
      - dev
      - main


jobs:
  upload-to-dev:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write
    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authenticate to GCP
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: 733119080752-compute@developer.gserviceaccount.com
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Setup Google Cloud SDK
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: Verify GCP Authentication
        run: |
          echo "Active project:"
          gcloud config get-value project

          echo "Authenticated identity:"
          gcloud auth list

          echo "Checking Composer bucket:"
          gcloud storage ls gs://us-central1-airflow-dev-953b3568-bucket/
      # Upload `variables.json` to Composer bucket
      - name: Upload Variables JSON to GCS
        run: |
          gcloud storage cp variables/dev/variables.json gs://us-central1-airflow-dev-953b3568-bucket/data/dev/variables.json

      # Import Variables into Airflow-DEV
      - name: Import Variables into Airflow-DEV
        run: |
          gcloud composer environments run airflow-dev \
            --location us-central1 \
            variables import -- /home/airflow/gcs/data/dev/variables.json

      # Sync Spark job to GCS
      - name: Upload Spark Job to GCS
        run: |
          gcloud storage cp spark_job/spark_transformation_job.py gs://airflow-projetcs-gds-dev-bkt/flight-booking-analysis/spark-job/


      # Sync Airflow DAG to Airflow DEV Composer
      - name: Upload Airflow DAG to DEV Environment (Dag Folder)
        run: |
          gcloud composer environments storage dags import \
            --environment airflow-dev \
            --location us-central1 \
            --source airflow_job/airflow_job.py

  upload-to-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Checkout the repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Authenticate to GCP Account
      - name: Authenticate to GCP
        uses: google-github-actions/auth@v3
        with:
         workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER_PROD }}
         service_account: YOUR_PROD_SERVICE_ACCOUNT
         project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Setup Google Cloud SDK
      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      # Upload `variables.json` to Composer bucket
      - name: Upload Variables JSON to GCS
        run: |
          gcloud storage cp variables/prod/variables.json gs://us-central1-airflow-prod-46040f60-bucket/data/prod/variables.json

      # Import Variables into Airflow-PROD
      - name: Import Variables into Airflow-PROD
        run: |
          gcloud composer environments run airflow-prod \
            --location us-central1 \
            variables import -- /home/airflow/gcs/data/prod/variables.json

      # Sync Spark job to GCS
      - name: Upload Spark Job to GCS
        run: |
          gcloud storage cp spark_job/spark_transformation_job.py gs://airflow-projetcs-gds-dev-bkt/flight-booking-analysis/spark-job/

      # Sync Airflow DAG to Airflow PROD Composer
      - name: Upload Airflow DAG to PROD Environment (Dag Folder)
        run: |
          gcloud composer environments storage dags import \
            --environment airflow-prod \
            --location us-central1 \
            --source airflow_job/airflow_job.py